
name: Build Moshiur Enterprise APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare app
        run: |
          cat > package.json <<'EOF'
          {
            "name": "moshiur-enterprise-lpg",
            "version": "1.0.0",
            "private": true
          }
          EOF
          npm install @capacitor/core@^7 @capacitor/android@^7
          npm install --save-dev @capacitor/cli@^7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.moshiurenterprise.lpg",
            "appName": "Moshiur Enterprise",
            "webDir": "www"
          }
          EOF
          mkdir -p www
          cp index.html app.js style.css manifest.json sw.js www/
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moshiur-Enterprise-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
