<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14532d"><link rel="manifest" href="manifest.json">
<title>মশিউর এন্টারপ্রাইজ LPG</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>মশিউর এন্টারপ্রাইজ</h1><p>LPG হিসাব অ্যাপ</p></header>
<main>
<section class="card"><h2>নতুন হিসাব</h2>
<label>ধরন<select id="type"><option value="বিক্রয়">বিক্রয়</option><option value="ক্রয়">ক্রয়</option><option value="খরচ">খরচ</option><option value="জমা">জমা</option></select></label>
<label>বিবরণ<input id="note" placeholder="যেমন: ১২ কেজি বসুন্ধরা"></label>
<label>টাকার পরিমাণ<input id="amount" type="number" min="0" step="0.01" placeholder="টাকা"></label>
<button id="save">হিসাব সংরক্ষণ</button>
</section>
<section class="card"><h2>আজকের হিসাব</h2><div id="totals"></div></section>
<section class="card"><h2>সাম্প্রতিক লেনদেন</h2><div id="entries"></div><button id="backup" class="secondary">ব্যাকআপ ডাউনলোড</button></section>
<p class="notice">সতর্কতা: এই প্রাথমিক সংস্করণে হিসাব শুধু এই ব্রাউজারের এই ফোনে থাকে। অনলাইন সিঙ্ক বা APK এখনো চালু হয়নি।</p>
</main><script src="app.js"></script>
</body></html>
